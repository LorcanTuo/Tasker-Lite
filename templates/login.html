<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – {{ cfg.APP_NAME }}</title>
    <script>(function(){var t=localStorage.getItem('app-theme');if(t)document.documentElement.setAttribute('data-bs-theme',t);})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .login-card {
            max-width: 420px;
            margin: 8vh auto 0;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,.12);
        }
        .login-header {
            background: {{ cfg.APP_COLOUR }};
            color: #fff;
            padding: 2rem;
            text-align: center;
            border-radius: .375rem .375rem 0 0;
        }
        .login-header i { font-size: 2.5rem; }
        .login-header h4 { margin: .5rem 0 0; font-weight: 700; letter-spacing: 1px; }

        [data-bs-theme="dark"] body { background: #0f1117; }
        [data-bs-theme="dark"] .login-card { box-shadow: 0 4px 20px rgba(0,0,0,.5); }
        [data-bs-theme="dark"] .login-header { background: {{ cfg.APP_COLOUR_DARK }}; }

        .theme-toggle-btn {
            position: fixed; top: 1rem; right: 1rem;
            z-index: 999;
        }
    </style>
</head>
<body>
    <button class="btn btn-outline-secondary btn-sm theme-toggle-btn" id="theme-toggle" title="Toggle dark mode">
        <i id="theme-icon" class="bi bi-moon"></i>
    </button>

    <div class="container">
        <div class="card login-card">
            <div class="login-header">
                <i class="{{ cfg.APP_ICON }}"></i>
                <h4>{{ cfg.APP_NAME }}</h4>
                <small class="opacity-75">Sign in to continue</small>
            </div>
            <div class="card-body p-4">
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username"
                                   autocomplete="username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password"
                                   autocomplete="current-password" required>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>
            </div>
            <div class="card-footer text-center text-muted small py-2">
                {{ cfg.APP_NAME }}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const btn  = document.getElementById('theme-toggle');
            function applyTheme(theme) {
                html.setAttribute('data-bs-theme', theme);
                localStorage.setItem('app-theme', theme);
                if (icon) icon.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
            }
            applyTheme(html.getAttribute('data-bs-theme') || 'light');
            if (btn) btn.addEventListener('click', function () {
                applyTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
            });
        })();
    </script>
</body>
</html>
